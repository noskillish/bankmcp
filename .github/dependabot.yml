# .github/dependabot.yml (fleet docs/standard.md). Keep only the ecosystems the
# repo uses. monthly and grouped to save Actions minutes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # python 3.12 -> 3.15 is a semver minor but a runtime migration (fleet standard).
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # Private srosenlund/* are unreachable for Dependabot; fleet SHAs are bumped
    # with fleet scripts/check_consumer_pins.py.
    ignore:
      - dependency-name: "srosenlund/*"
    groups:
      actions:
        patterns: ["*"]
